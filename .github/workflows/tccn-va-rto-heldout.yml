name: TCCN VA-RTO frozen-seed independent confirmation
on:
  push:
    branches: [research/tccn-va-rto]
    paths: [.github/workflows/tccn-va-rto-heldout.yml]
  workflow_dispatch:
jobs:
  heldout:
    strategy:
      fail-fast: false
      matrix:
        scenario: [departure_outage, sumo_fixed_timing, sumo_adaptive_timing]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned SUMO 1.20 and AirFogSim Python dependencies
        run: |
          python -m pip install 'eclipse-sumo==1.20.0'
          echo "$(python -c 'import sumo; print(sumo.SUMO_HOME)')/bin" >> "$GITHUB_PATH"
          python -m pip install 'numpy==1.26.4' 'pandas==2.2.2' 'PyYAML>=6,<7' 'sumolib==1.20.0' 'traci==1.20.0' 'networkx>=3.2,<4' 'matplotlib>=3.7,<4' 'pillow>=10,<12' 'shapely>=2,<3' 'osmnx==1.9.4' 'tqdm>=4,<5' 'scipy>=1.11,<2' 'sympy>=1.12,<2'
      - name: Pin upstream AirFogSim
        run: |
          git clone --quiet https://github.com/ZhiweiWei-NAMI/AirFogSim.git /tmp/airfogsim
          git -C /tmp/airfogsim checkout --quiet 76c0edb4ac6c7b5e09cc146db9928c1bc64bbb60
          echo "PROJECT_COMMIT=$(git rev-parse HEAD)"
          echo "AIRFOGSIM_COMMIT=$(git -C /tmp/airfogsim rev-parse HEAD)"
          sumo --version | head -2
      - name: Independent seed 200-219, freeze code, compare three policies
        run: |
          cd research/tccn_va_rto
          case "${{ matrix.scenario }}" in
            departure_outage) FLAGS="--outage 0.08 --burst 1" ;;
            sumo_fixed_timing) FLAGS="--sumo-mode --outage 0.08 --burst 2" ;;
            sumo_adaptive_timing) FLAGS="--sumo-mode --adaptive-timing --outage 0.08 --burst 2" ;;
          esac
          PYTHONPATH="$PWD:/tmp/airfogsim" python -m tccn_va_rto.airfogsim_joint --airfogsim-root /tmp/airfogsim --steps 129 --seeds 20 --seed-start 200 $FLAGS --out results/heldout_${{ matrix.scenario }}
          python -m tccn_va_rto.analyze_joint results/heldout_${{ matrix.scenario }}
          printf 'GitHub commit: %s\nAirFogSim commit: %s\nSeed range: 200-219\nScenario: %s\n' \
            "$(git rev-parse HEAD)" "$(git -C /tmp/airfogsim rev-parse HEAD)" "${{ matrix.scenario }}" \
            > results/heldout_${{ matrix.scenario }}/run_provenance.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: heldout-${{ matrix.scenario }}-seed200-219
          path: research/tccn_va_rto/results/heldout_${{ matrix.scenario }}/
          retention-days: 30
